;

; Caribbean Legend requires wTextureWidth/wTextureHeight for picture groups.
; These groups deliberately keep the user's existing portraits.
; The F1 fleet strip asks for SHIPS_<ShipsTypes.Name> without a hull suffix.
[SHIPS_BlackPearl]
sTextureName = ships\BlackPearl.tga
wTextureWidth = 1024
wTextureHeight = 1024
picture = ship,0,0,1024,1024
